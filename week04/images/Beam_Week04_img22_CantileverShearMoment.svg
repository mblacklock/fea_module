<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-labelledby="title desc">
<title id="title">Cantilever shear-force and bending-moment diagrams</title>
<desc id="desc">With x measured from the free end A to the fixed end B, shear V is constant at minus P. Moment M is minus P times x, decreasing linearly from zero at A to minus PL at B. Negative values are plotted below the zero axes.</desc>
<defs><marker id="axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#475569" stroke="none"/></marker></defs>
<rect width="900" height="530" fill="white"/>
<!-- Negative shear is constant over the span. -->
<path d="M120 100 H750 V185 H120Z" fill="#e5effb"/>
<path d="M120 100 V185 H750 V100" fill="none" stroke="#246bd2" stroke-width="3"/>
<!-- Negative bending moment increases in magnitude towards the fixed end. -->
<path d="M120 350 H750 V475Z" fill="#e5effb"/>
<path d="M120 350 L750 475 V350" fill="none" stroke="#246bd2" stroke-width="3"/>
<!-- Common span endpoints and axes; positive ordinates point upwards. -->
<g fill="none" stroke="#475569" stroke-width="1.7" marker-end="url(#axis)">
<path d="M90 100 H815"/><path d="M120 210 V55"/>
<path d="M90 350 H815"/><path d="M120 495 V305"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#253d49">
<text x="120" y="30">Shear-force diagram</text><text x="120" y="280">Bending-moment diagram</text>
</g>
<g font-family="Georgia, serif" font-style="italic" font-size="27" fill="#253d49">
<text x="80" y="64">V</text><text x="80" y="315">M</text>
<text x="827" y="109">x</text><text x="827" y="359">x</text>
<text x="98" y="132">0</text><text x="98" y="382">0</text>
<text x="735" y="85">L</text><text x="735" y="335">L</text>
<text x="60" y="193">−P</text><text x="760" y="483">−PL</text>
<text x="390" y="164" fill="#246bd2">V = −P</text><text x="410" y="465" fill="#246bd2">M = −Px</text>
</g></svg>
