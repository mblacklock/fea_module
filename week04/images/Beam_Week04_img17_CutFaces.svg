<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">Matching cut faces for defining the sign convention</title>
  <desc id="desc">Two separated beam segments with room to add shear-force and bending-moment arrows at their matching cut faces.</desc>
  <!-- Canvas background. -->
  <rect width="1000" height="280" fill="white"/>
  <!-- Left-hand segment: its right end is the cut face. -->
  <rect x="40" y="100" width="260" height="40" fill="#c3dce8" stroke="#4986a1" stroke-width="2"/>
  <!-- Right-hand segment: its left end is the matching cut face. -->
  <rect x="700" y="100" width="260" height="40" fill="#c3dce8" stroke="#4986a1" stroke-width="2"/>
  <!-- Segment labels. -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#253d49" text-anchor="middle">
    <text x="500" y="35" font-size="26">Matching cut faces</text>
    <text x="170" y="253" font-size="23">Left-hand segment</text>
    <text x="830" y="253" font-size="23">Right-hand segment</text>
  </g>
</svg>
