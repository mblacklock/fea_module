<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" role="img" aria-labelledby="title desc">
<title id="title">Cantilever cut free-body diagram with positive internal actions</title><desc id="desc">The left segment A-C carries the downward applied load P. Positive shear V points down along the cut face and positive moment M acts anticlockwise. The cut is x from A.</desc>
<defs>
  <!-- Blue applied loads and red reactions or internal actions. -->
  <marker id="load" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#246bd2" stroke="none"/></marker>
  <marker id="force" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#dc4455" stroke="none"/></marker>
  <marker id="dimension" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#475569" stroke-width="1.5"/></marker>
</defs>
<rect width="900" height="270" fill="white"/>

<!-- Isolated left-hand segment and applied end load. -->
<rect x="120" y="120" width="320" height="38" fill="#c3dce8" stroke="#4986a1" stroke-width="2"/>
<path d="M120 42 V116" fill="none" stroke="#246bd2" stroke-width="3.5" marker-end="url(#load)"/>
<!-- Positive internal actions: downward shear at the cut and anticlockwise moment. -->
<path d="M450 100 V178" fill="none" stroke="#dc4455" stroke-width="3.5" marker-end="url(#force)"/>
<path d="M490 200 C565 200 565 80 490 80" fill="none" stroke="#dc4455" stroke-width="3.5" marker-end="url(#force)"/>
<!-- Position of the cut measured from the free end. -->
<path d="M120 78 H440" fill="none" stroke="#475569" stroke-width="1.5" marker-start="url(#dimension)" marker-end="url(#dimension)"/>
<rect x="265" y="60" width="30" height="32" fill="white"/>
<g font-family="Georgia, serif" font-style="italic" font-size="27" fill="#253d49">
<text x="272" y="85">x</text><text x="105" y="193">A</text><text x="419" y="193">C</text>
<text x="85" y="42" fill="#246bd2">P</text><text x="465" y="164" fill="#dc4455">V</text><text x="562" y="149" fill="#dc4455">M</text>
</g></svg>
