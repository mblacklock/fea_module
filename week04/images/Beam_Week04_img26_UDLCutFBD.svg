<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc"><title id="title">UDL beam: cut free-body diagram</title><desc id="desc">The isolated left segment A-C has length x. The UDL is replaced by wx acting at its midpoint. The upward reaction is wL/2. Positive V is downwards and positive M anticlockwise at C.</desc>
<defs><marker id="load" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#246bd2" stroke="none"/></marker><marker id="force" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#dc4455" stroke="none"/></marker><marker id="dim" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs><rect width="1000" height="310" fill="white"/>
<!-- Isolated beam segment, with its UDL replaced by the resultant wx. -->
<rect x="120" y="110" width="360" height="38" fill="#c3dce8" stroke="#4986a1" stroke-width="2"/>
<path d="M300 30 V105" fill="none" stroke="#246bd2" stroke-width="3.5" marker-end="url(#load)"/>
<!-- Reaction at A and positive internal actions at the cut C. -->
<g fill="none" stroke="#dc4455" stroke-width="3.5" marker-end="url(#force)"><path d="M120 220 V152"/><path d="M490 93 V178"/><path d="M530 202 C605 202 605 72 530 72"/></g>
<!-- The resultant acts x/2 from the cut; the full segment has length x. -->
<path d="M300 235 H480" fill="none" stroke="#475569" stroke-width="1.5" marker-start="url(#dim)" marker-end="url(#dim)"/>
<path d="M120 280 H480" fill="none" stroke="#475569" stroke-width="1.5" marker-start="url(#dim)" marker-end="url(#dim)"/>
<rect x="365" y="217" width="50" height="32" fill="white"/><rect x="285" y="262" width="30" height="32" fill="white"/>
<g font-family="Georgia, serif" font-style="italic" font-size="26" fill="#253d49"><text x="372" y="242">x/2</text><text x="292" y="287">x</text><text x="90" y="167">A</text><text x="458" y="182">C</text><text x="320" y="35" fill="#246bd2">wx</text><text x="120" y="249" text-anchor="middle" fill="#dc4455">wL/2</text><text x="505" y="157" fill="#dc4455">V</text><text x="610" y="145" fill="#dc4455">M</text></g>
</svg>