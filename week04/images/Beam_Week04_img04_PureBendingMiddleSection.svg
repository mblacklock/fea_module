<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" role="img" aria-labelledby="title desc">
  <title id="title">Isolated middle section C-D under pure bending</title>
  <desc id="desc">Equal and opposite end couples of 60000 newton millimetres act on the middle section C-D.</desc>
  <defs>
    <marker id="forceArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#dc4455" />
    </marker>
    <marker id="dimArrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#475569" stroke-width="1.4" />
    </marker>
  </defs>
  <rect width="1000" height="200" fill="white" />
  <g transform="translate(0 -315)">
    <rect x="300" y="394" width="400" height="12" fill="#d7eaf2" stroke="#4986a1" stroke-width="2" />
    <g stroke="#dc4455" stroke-width="4" stroke-linecap="round" fill="none" marker-end="url(#forceArrow)">
      <path d="M273 363 C220 365 220 435 273 437" />
      <path d="M727 363 C780 365 780 435 727 437" />
    </g>
    <g font-family="Georgia, serif" font-style="italic" font-size="25" fill="#253d49">
      <text x="293" y="381">C</text>
      <text x="689" y="381">D</text>
    </g>
    <g font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#dc4455" text-anchor="middle">
      <text x="252" y="480">M′ = 60 000 N mm</text>
      <text x="748" y="480">M = 60 000 N mm</text>
    </g>
  </g>
</svg>