<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 395" role="img" aria-labelledby="title desc">
<title id="title">Cantilever deflected shape</title><desc id="desc">The beam is fixed at B on the right. Its undeformed centreline is horizontal. The exaggerated deflected curve has zero displacement and slope at B and a maximum downward displacement minus PL cubed over 3EI and slope PL squared over 2EI at the free end A.</desc>
<defs><marker id="load" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#246bd2" stroke="none"/></marker><marker id="dim" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#475569" stroke-width="1.5"/></marker></defs><rect width="1000" height="395" fill="white"/>
<!-- Undeformed reference line and fixed support at B. -->
<path d="M120 120 H750" fill="none" stroke="#929ba4" stroke-width="1.8" stroke-dasharray="8 6"/>
<rect x="750" y="70" width="25" height="130" fill="#ded9c5"/>
<!-- Deflected centreline follows the cubic solution, exaggerated for clarity. -->
<path d="M120 260 C330 190 540 120 750 120" fill="none" stroke="#246bd2" stroke-width="3.5"/>
<path d="M120 195 V253" fill="none" stroke="#246bd2" stroke-width="3.5" marker-end="url(#load)"/>
<!-- Free-end displacement measured from the undeformed centreline. -->
<path d="M80 120 V260" fill="none" stroke="#475569" stroke-width="1.5" marker-start="url(#dim)" marker-end="url(#dim)"/>
<path d="M70 120 H115 M70 260 H115" fill="none" stroke="#929ba4" stroke-width="1.3"/>
<g font-family="Georgia, serif" font-style="italic" font-size="26" fill="#253d49"><text x="115" y="105">A</text><text x="718" y="105">B</text><text x="140" y="203" fill="#246bd2">P</text><text x="120" y="301">v = −PL³/(3EI)</text><text x="120" y="342">dv/dx = PL²/(2EI)</text><text x="800" y="109">v = 0</text><text x="800" y="150">dv/dx = 0</text></g>
<g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#253d49"><text x="305" y="91">Undeformed centreline</text><text x="800" y="54">x = L</text><text x="115" y="58">x = 0</text></g></svg>
