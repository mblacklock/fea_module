<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" role="img" aria-labelledby="title">
<title id="title">Three-dimensional stress state with three normal stresses and six complementary shear stresses on the visible faces</title>
  <defs>
    <!-- Arrowheads terminate at the specified end point. -->
    <marker id="load" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#246bd2" stroke="none"/></marker>
    <marker id="axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#354954" stroke="none"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#29434f}
      .math{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:28px}
      .small{font-size:20px}
      .outline{fill:#dfedf1;stroke:#29434f;stroke-width:2.5;stroke-linejoin:round}
      .load{stroke-linecap:butt;fill:none;stroke:#246bd2;stroke-width:3;marker-end:url(#load)}
      .axis{stroke-linecap:butt;fill:none;stroke:#354954;stroke-width:2;marker-end:url(#axis)}
      .dim{stroke-linecap:butt;fill:none;stroke:#596773;stroke-width:1.8;marker-start:url(#axis);marker-end:url(#axis)}
      .guide{fill:none;stroke:#8a959e;stroke-width:1.5;stroke-dasharray:7 6}
      .extension{stroke:#8a959e;stroke-width:1.5}
    </style>
    <!-- Separate shear marker preserves the distinction between normal and tangential stresses. -->
    <marker id="shear" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#008b85" stroke="none"/></marker>
    <style>.shear{stroke-linecap:butt;fill:none;stroke:#008b85;stroke-width:3;marker-end:url(#shear)}</style>
  </defs>
<rect width="900" height="660" fill="white"/>

  <!-- Isometric material element: positive y face above, positive z face left, positive x face right. -->
  <path class="outline" d="M500 150 L700 265 L500 380 L300 265 Z"/>
  <path d="M500 380 L700 265 V495 L500 610 Z" fill="#c6dde5" stroke="#29434f" stroke-width="2.5" stroke-linejoin="round"/>
  <path class="outline" d="M300 265 L500 380 V610 L300 495 Z"/>
  <!-- Normal stresses are blue. Each complete stress-arrow group originates at the geometric centre of its face. -->
  <path class="load" d="M500 265 V70"/>
  <path class="load" d="M600 437.5 L738.56 517.5"/>
  <path class="load" d="M400 437.5 L261.44 517.5"/>
  <!-- Shear stresses on the y-normal face: positive x and positive z directions. -->
  <path class="shear" d="M500 265 L586.6 315"/>
  <path class="shear" d="M500 265 L413.4 315"/>
  <!-- Shear stresses on the x-normal face: positive y and positive z directions. -->
  <path class="shear" d="M600 437.5 V342.5"/>
  <path class="shear" d="M600 437.5 L530.72 477.5"/>
  <!-- Shear stresses on the z-normal face: positive y and positive x directions. -->
  <path class="shear" d="M400 437.5 V342.5"/>
  <path class="shear" d="M400 437.5 L469.28 477.5"/>
<text class="math" x="520" y="92" style="fill:#29434f">σ<tspan font-size="20" baseline-shift="sub">y</tspan></text>
<text class="math" x="760" y="510" text-anchor="middle" style="fill:#29434f">σ<tspan font-size="20" baseline-shift="sub">x</tspan></text>
<text class="math" x="235" y="510" text-anchor="middle" style="fill:#29434f">σ<tspan font-size="20" baseline-shift="sub">z</tspan></text>
<text class="math" x="552" y="275" style="fill:#008b85">τ<tspan font-size="20" baseline-shift="sub">yx</tspan></text>
<text class="math" x="390" y="275" style="fill:#008b85">τ<tspan font-size="20" baseline-shift="sub">yz</tspan></text>
<text class="math" x="618" y="386" style="fill:#008b85">τ<tspan font-size="20" baseline-shift="sub">xy</tspan></text>
<text class="math" x="535" y="515" style="fill:#008b85">τ<tspan font-size="20" baseline-shift="sub">xz</tspan></text>
<text class="math" x="335" y="386" style="fill:#008b85">τ<tspan font-size="20" baseline-shift="sub">zy</tspan></text>
<text class="math" x="430" y="515" style="fill:#008b85">τ<tspan font-size="20" baseline-shift="sub">zx</tspan></text>
  <!-- Equal-length global axes parallel to all component arrows. -->
  <path class="axis" d="M110 525 V435"/>
  <path class="axis" d="M110 525 L187.94 570"/>
  <path class="axis" d="M110 525 L32.06 570"/>
  <text class="math" x="101" y="423">y</text>
  <text class="math" x="197" y="584">x</text>
  <text class="math" x="13" y="584">z</text>

</svg>
