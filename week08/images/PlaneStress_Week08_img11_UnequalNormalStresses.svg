<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
<title id="title">Unequal normal stresses on a rectangular block</title>
<desc id="desc">The x direction is horizontal, y is vertical and z projects down and left. Tensile stress of positive 120 MPa acts in x, compressive stress of negative 40 MPa acts in y, and the z faces are traction-free. Arrows show the loading on the visible x and y faces; opposite faces carry balancing tractions.</desc>
<defs>
<marker id="load" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#246bd2" stroke="none"/></marker>
<marker id="axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#354954" stroke="none"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#29434f}.math{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:28px}.load{stroke-linecap:butt;fill:none;stroke:#246bd2;stroke-width:3;marker-end:url(#load)}.axis{stroke-linecap:butt;fill:none;stroke:#354954;stroke-width:2;marker-end:url(#axis)}</style>
</defs>
<rect width="900" height="440" fill="white"/>
<!-- Face normals follow the global x, y and z directions. -->
<path d="M280 160 L370 105 H620 L530 160 Z" fill="#dfedf1" stroke="#29434f" stroke-width="2.5"/>
<path d="M530 160 L620 105 V300 L530 355 Z" fill="#c6dde5" stroke="#29434f" stroke-width="2.5"/>
<path d="M280 160 H530 V355 H280 Z" fill="#dfedf1" stroke="#29434f" stroke-width="2.5"/>
<!-- Outward x traction is tensile; inward y traction is compressive. -->
<path class="load" d="M575 230 H775"/>
<path class="load" d="M450 35 V132"/>
<text x="640" y="205"><tspan class="math">σ<tspan baseline-shift="sub" font-size="19">x</tspan></tspan> = +120 MPa</text>
<text x="472" y="65"><tspan class="math">σ<tspan baseline-shift="sub" font-size="19">y</tspan></tspan> = −40 MPa</text>
<text x="355" y="265"><tspan class="math">σ<tspan baseline-shift="sub" font-size="19">z</tspan></tspan> = 0</text>
<!-- Independent axis key, kept clear of the block and loads. -->
<path class="axis" d="M120 300 H210"/>
<path class="axis" d="M120 300 V210"/>
<path class="axis" d="M120 300 L42 345"/>
<text class="math" x="220" y="310">x</text><text class="math" x="110" y="195">y</text><text class="math" x="23" y="368">z</text>
</svg>
