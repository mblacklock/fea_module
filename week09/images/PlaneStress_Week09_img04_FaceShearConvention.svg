<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 390" role="img" aria-labelledby="title"><title id="title">Clockwise shear on one face plots above the axis; anticlockwise shear plots below</title>
<defs><marker id="load" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#246bd2" stroke="none"/></marker><marker id="shear" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#008b85" stroke="none"/></marker><marker id="axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#596773" stroke="none"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:23px;fill:#29434f}.math{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:28px}.small{font-size:19px}.load,.shear,.axis{fill:none;stroke-linecap:butt;stroke-width:3;marker-end:url(#load);stroke:#246bd2}.shear{stroke:#008b85;marker-end:url(#shear)}.axis{stroke:#596773;stroke-width:2;marker-end:url(#axis)}.guide{fill:none;stroke:#8a959e;stroke-width:1.5;stroke-dasharray:7 6}</style></defs><rect width="950" height="390" fill="white"/>
<!-- Top-face shear to the right is clockwise; to the left it is anticlockwise. -->
<rect x="50" y="100" width="140" height="140" fill="#dfedf1" stroke="#29434f" stroke-width="2.5"/><path class="shear" d="M80 85 L160 85"/><path class="axis" d="M95 185 A38 38 0 1 1 140 203"/><path class="axis" d="M280 245 L395 245"/><path class="axis" d="M300 300 L300 115"/><text x="400" y="255" class="math">σ</text><text x="287" y="100" class="math">τ</text><circle cx="350" cy="195" r="5" fill="#246bd2"/><text x="55" y="345" class="">Clockwise → above</text><rect x="500" y="100" width="140" height="140" fill="#dfedf1" stroke="#29434f" stroke-width="2.5"/><path class="shear" d="M610 85 L530 85"/><path class="axis" d="M590 203 A38 38 0 1 0 545 185"/><path class="axis" d="M730 245 L845 245"/><path class="axis" d="M750 300 L750 115"/><text x="850" y="255" class="math">σ</text><text x="737" y="100" class="math">τ</text><circle cx="800" cy="290" r="5" fill="#246bd2"/><text x="505" y="345" class="">Anticlockwise → below</text></svg>