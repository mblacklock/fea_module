<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title"><title id="title">Plane stress: sigma x 60, sigma y 40, positive tau xy 20 MPa</title>
<defs><marker id="load" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#246bd2" stroke="none"/></marker><marker id="shear" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#008b85" stroke="none"/></marker><marker id="axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#596773" stroke="none"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:23px;fill:#29434f}.math{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:28px}.small{font-size:19px}.load,.shear,.axis{fill:none;stroke-linecap:butt;stroke-width:3;marker-end:url(#load);stroke:#246bd2}.shear{stroke:#008b85;marker-end:url(#shear)}.axis{stroke:#596773;stroke-width:2;marker-end:url(#axis)}.guide{fill:none;stroke:#8a959e;stroke-width:1.5;stroke-dasharray:7 6}</style></defs><rect width="900" height="500" fill="white"/>
<!-- Normal stresses in blue and positive tensor xy shear in teal. -->
<rect x="310" y="150" width="240" height="200" fill="#dfedf1" stroke="#29434f" stroke-width="2.5"/><path class="load" d="M550 250 L680 250"/><path class="load" d="M310 250 L180 250"/><path class="load" d="M430 150 L430 60"/><path class="load" d="M430 350 L430 440"/><path class="shear" d="M570 320 L570 180"/><path class="shear" d="M290 180 L290 320"/><path class="shear" d="M350 130 L510 130"/><path class="shear" d="M510 370 L350 370"/><text x="690" y="260" class="math">σ<tspan font-size="18" baseline-shift="sub">x</tspan> = 60 MPa</text><text x="445" y="62" class="math">σ<tspan font-size="18" baseline-shift="sub">y</tspan> = 40 MPa</text><text x="595" y="170" class="math">τ<tspan font-size="18" baseline-shift="sub">xy</tspan> = 20 MPa</text><path class="axis" d="M100 390 L180 390"/><path class="axis" d="M100 390 L100 310"/><text x="190" y="400" class="math">x</text><text x="90" y="295" class="math">y</text></svg>