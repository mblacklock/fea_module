<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -70 1400 1180" role="img" aria-labelledby="title desc">
<title id="title">Original stresses and equivalent rotated principal and maximum in-plane shear stress states</title>
<desc id="desc">Original normal stresses are 60 and 40 MPa, with positive xy shear 20 MPa. Dotted directions show the principal orientation at 31.72 degrees counterclockwise and positive maximum-shear orientation at 13.28 degrees clockwise. These directions differ by 45 degrees. Principal stresses are 72.36 and 27.64 MPa, with zero shear. At maximum in-plane shear the normal stresses are both 50 MPa and shear is positive 22.36 MPa.</desc>
<defs>
<marker id="normal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#246bd2" stroke="none"/></marker>
<marker id="shear" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#008b85" stroke="none"/></marker>
<marker id="axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#596773" stroke="none"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#29434f;font-size:30px}.math{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:31px}.heading{font-size:31px;font-weight:bold}.normal,.shear,.axis{fill:none;stroke-width:3;stroke-linecap:butt;stroke:#246bd2;marker-end:url(#normal)}.shear{stroke:#008b85;marker-end:url(#shear)}.axis{stroke:#596773;stroke-width:2;marker-end:url(#axis)}.guide{fill:none;stroke:#a0aab0;stroke-width:2;stroke-dasharray:8 7}.direction{fill:none;stroke:#596773;stroke-width:2;stroke-dasharray:8 7}.angle{fill:none;stroke:#596773;stroke-width:2}</style>
</defs><rect y="-70" width="1400" height="1180" fill="white"/>
