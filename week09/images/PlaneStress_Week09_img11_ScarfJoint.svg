<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title"><title id="title">Vertical tensile scarf joint: 80 by 10 mm section, normal at 25 degrees to horizontal, adhesive plane at 65 degrees</title>
