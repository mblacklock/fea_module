<style>text{font-family:Arial,Helvetica,sans-serif;font-size:23px;fill:#29434f}.math{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:28px}.small{font-size:19px}.load,.shear,.axis{fill:none;stroke-linecap:butt;stroke-width:3;marker-end:url(#load);stroke:#246bd2}.shear{stroke:#008b85;marker-end:url(#shear)}.axis{stroke:#596773;stroke-width:2;marker-end:url(#axis)}.guide{fill:none;stroke:#8a959e;stroke-width:1.5;stroke-dasharray:7 6}</style></defs><rect width="900" height="540" fill="white"/>
