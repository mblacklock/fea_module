<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" aria-labelledby="title desc">
<title id="title">Both in-plane principal stresses tensile: three Mohr circles</title>
<desc id="desc">The three circles join sigma 1 to sigma 2, sigma 1 to zero, and sigma 2 to zero. Their centres are labelled C12, C10 and C20. The largest circle and its vertical radius R max are highlighted in teal. Normal stress is positive rightwards and plotted shear is positive upwards.</desc>
<defs><marker id="axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#596773" stroke="none"/></marker></defs>
<style>text{font-family:Georgia,'Times New Roman',serif;font-style:italic;fill:#29434f}.axis{fill:none;stroke:#596773;stroke-width:2;marker-end:url(#axis)}</style>
<rect width="720" height="620" fill="white"/><circle data-pair="20" cx="180" cy="320" r="80" fill="none" stroke="#8a959e" stroke-width="2.5"/><circle data-pair="12" cx="420" cy="320" r="160" fill="none" stroke="#246bd2" stroke-width="2.5"/><circle data-pair="10" cx="340" cy="320" r="240" fill="none" stroke="#008b85" stroke-width="4"/><path class="axis" d="M55 320 H660"/><path class="axis" d="M100 590 V48"/><text x="680" y="330" text-anchor="middle" font-size="29">σ</text><text x="86" y="30" text-anchor="middle" font-size="29">τ</text><path d="M340 320 V80" fill="none" stroke="#008b85" stroke-width="4"/><text x="362" y="145" text-anchor="start" font-size="29">R<tspan baseline-shift="sub" font-size="19">max</tspan></text><circle cx="180" cy="320" r="4" fill="#8a959e"/><path d="M180 330 V353" fill="none" stroke="#8a959e" stroke-width="1.2"/><text x="180" y="380" text-anchor="middle" font-size="26">C<tspan baseline-shift="sub" font-size="19">20</tspan></text><circle cx="420" cy="320" r="4" fill="#246bd2"/><path d="M420 330 V353" fill="none" stroke="#246bd2" stroke-width="1.2"/><text x="420" y="380" text-anchor="middle" font-size="26">C<tspan baseline-shift="sub" font-size="19">12</tspan></text><circle cx="340" cy="320" r="4" fill="#008b85"/><path d="M340 330 V353" fill="none" stroke="#008b85" stroke-width="1.2"/><text x="340" y="380" text-anchor="middle" font-size="26">C<tspan baseline-shift="sub" font-size="19">10</tspan></text><circle cx="580" cy="320" r="5" fill="#246bd2"/><text x="580" y="350" text-anchor="middle" font-size="29">σ<tspan baseline-shift="sub" font-size="19">1</tspan></text><circle cx="260" cy="320" r="5" fill="#246bd2"/><text x="260" y="350" text-anchor="middle" font-size="29">σ<tspan baseline-shift="sub" font-size="19">2</tspan></text><text x="86" y="350" text-anchor="end" font-size="25">0</text></svg>