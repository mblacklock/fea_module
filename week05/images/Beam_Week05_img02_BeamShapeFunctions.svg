<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc"><title id="title">Four nodal contributions to beam deflection</title><desc id="desc">Each panel changes one bending degree of freedom and keeps the other three zero. Displacement at node 1 produces a curve with a raised left end and flat end slopes. Rotation at node 1 produces an interior positive curve with zero end displacements. Displacement at node 2 raises the right end with flat end slopes. Rotation at node 2 produces an interior negative curve with zero end displacements.</desc><rect width="1120" height="650" fill="white"/>
