<text x="130" y="94" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#246bd2">N₁ = 1</text>
<text x="95" y="240" font-family="Arial" font-size="22" fill="#253d49">1</text><text x="505" y="240" font-family="Arial" font-size="22" fill="#253d49">2</text>
<text x="305" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#253d49">Only v₁ changes; the other three DOFs are zero.</text>
<g transform='translate(550 -305)'>
