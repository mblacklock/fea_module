<text x="645" y="240" font-family="Arial" font-size="22" fill="#253d49">1</text><text x="1055" y="240" font-family="Arial" font-size="22" fill="#253d49">2</text>
<text x="855" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#253d49">Only v₂ changes; the other three DOFs are zero.</text>
</g>
