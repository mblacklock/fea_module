<g transform='translate(65 10)' fill='#333' font-family='Cambria, Georgia, serif' font-style='italic' font-size='25'><path d='M40 270 V35' fill='none' stroke='#333' stroke-width='2' marker-end='url(#axis)'/><path d='M40 155 H460' fill='none' stroke='#333' stroke-width='2' marker-end='url(#axis)'/><text x='473' y='164'>x</text><text x='18' y='12'>N<tspan baseline-shift='sub' font-size='18'>1</tspan>(x)</text><text x='20' y='181' font-style='normal'>0</text></g>
