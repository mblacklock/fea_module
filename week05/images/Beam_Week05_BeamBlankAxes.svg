<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 1100 630" role="img" aria-label="Four blank coordinate systems for sketching beam shape functions"><defs><marker id="axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#333" stroke="none"/></marker></defs><rect width="1100" height="620" fill="white"/>
