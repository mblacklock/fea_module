<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Shear stress increases linearly with radius</title>
  <desc id="desc">The hollow shaft has no material below inner radius c_i. Shear stress increases linearly from tau_min at c_i to tau_max at the outer radius c_o.</desc>
  <defs>
    <marker id="axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#304955"/></marker>
  </defs>
  <style>text{font-family:Georgia,'Times New Roman',serif;font-size:28px;fill:#304955}.math{font-style:italic}.axis{fill:none;stroke:#304955;stroke-width:2;marker-end:url(#axis)}.guide{fill:none;stroke:#8a99a2;stroke-width:1.5;stroke-dasharray:6 6}</style>
  <rect width="800" height="420" fill="white"/>
  <!-- Empty bore: there is no shaft material at radii below c_i. -->
  <rect x="151" y="90" width="249" height="239" fill="#f2f4f5"/>
  <text x="275" y="280" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:21px">No material</text>
  <!-- Radial distance and shear-stress axes. -->
  <path d="M150 330 H720" class="axis"/>
  <path d="M150 330 V45" class="axis"/>
  <text x="735" y="340" class="math">ρ</text>
  <text x="133" y="40" class="math">τ</text>
  <text x="130" y="356" text-anchor="end">0</text>
  <!-- Linear radial distribution and the maximum at the outside surface. -->
  <path d="M150 80 H650 V330" class="guide"/>
  <path d="M400 205 L650 80" fill="none" stroke="#007c88" stroke-width="4"/>
  <circle cx="650" cy="80" r="5" fill="#007c88"/>
  <circle cx="400" cy="205" r="4" fill="#007c88"/>
  <path d="M150 205 H400 V330" class="guide"/>
  <text x="131" y="212" text-anchor="end" class="math">τ<tspan baseline-shift="sub" font-size="19">min</tspan></text>
  <text x="400" y="363" text-anchor="middle" class="math">c<tspan baseline-shift="sub" font-size="19">i</tspan></text>
  <text x="131" y="87" text-anchor="end" class="math">τ<tspan baseline-shift="sub" font-size="19">max</tspan></text>
  <text x="650" y="363" text-anchor="middle" class="math">c<tspan baseline-shift="sub" font-size="19">o</tspan></text>
  <text x="400" y="405" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:22px">Distance from the shaft axis</text>
</svg>
