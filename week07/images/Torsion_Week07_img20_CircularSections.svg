<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title">
<title id="title">Solid section diameter d and hollow section outer and inner diameters Do and Di</title>
<defs>
  <!-- Arrowheads for axes, dimensions and applied torque. -->
  <marker id="axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#304955"/></marker>
  <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#d33d50"/></marker>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-size:24px;fill:#304955} .math{font-family:Georgia,serif;font-style:italic} .line{fill:none;stroke:#304955;stroke-width:2.5} .dim{fill:none;stroke:#52626c;stroke-width:1.8;marker-start:url(#axis);marker-end:url(#axis)} .red{fill:none;stroke:#d33d50;stroke-width:3;marker-end:url(#red)} .guide{fill:none;stroke:#87959c;stroke-width:1.6;stroke-dasharray:6 6}</style>
<rect width="1000" height="400" fill="white"/>

<!-- Solid circular section and its full diameter dimension. -->
<circle cx="260" cy="180" r="100" fill="#dcebf0" stroke="#304955" stroke-width="2.5"/>
<path d="M160 180 H360" class="dim"/>
<rect x="244" y="162" width="32" height="33" fill="#dcebf0"/><text x="260" y="187" text-anchor="middle" class="math">d</text>
<text x="260" y="42" text-anchor="middle">Solid section</text>
<!-- Annular section: diameters use separate extension lines below it. -->
<circle cx="740" cy="180" r="100" fill="#dcebf0" stroke="#304955" stroke-width="2.5"/>
<circle cx="740" cy="180" r="55" fill="white" stroke="#304955" stroke-width="2.5"/>
<path d="M640 180 V345 M840 180 V345 M685 180 V305 M795 180 V305" class="guide"/>
<path d="M685 293 H795 M640 335 H840" class="dim"/>
<rect x="721" y="275" width="38" height="32" fill="white"/><text x="740" y="301" text-anchor="middle" class="math">Dᵢ</text>
<rect x="720" y="317" width="40" height="32" fill="white"/><text x="740" y="343" text-anchor="middle" class="math">Dₒ</text>
<text x="740" y="42" text-anchor="middle">Hollow section</text>

</svg>